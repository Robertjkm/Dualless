name: Build & Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyaudiowpatch || true

      - name: Run unit tests before build
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build single-file portable Dualless.exe
        run: |
          python -m PyInstaller --name "Dualless" --windowed --onefile --clean --noconfirm --icon "dualcontrol\ui\assets\app_icon.ico" --add-data "dualcontrol\ui\assets;dualcontrol\ui\assets" run.py
          Move-Item -Force "dist\Dualless.exe" "dist\Dualless-portable.exe"

      - name: Build onedir Dualless folder archive
        run: |
          python -m PyInstaller --name "Dualless" --windowed --onedir --clean --noconfirm --icon "dualcontrol\ui\assets\app_icon.ico" --add-data "dualcontrol\ui\assets;dualcontrol\ui\assets" run.py
          Compress-Archive -Path "dist\Dualless" -DestinationPath "dist\Dualless-win64-onedir.zip" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dualless-Windows-x64
          path: |
            dist/Dualless-portable.exe
            dist/Dualless-win64-onedir.zip

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Dualless-portable.exe
            dist/Dualless-win64-onedir.zip
